stages:
  - build
  - deploy

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  variables:
    IMAGE_TAG: harbor.hitman.barysgame.kz/portfolio/hitman:$CI_COMMIT_SHORT_SHA
    IMAGE_LATEST: harbor.hitman.barysgame.kz/portfolio/hitman:latest
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"harbor.hitman.barysgame.kz\":{\"username\":\"$HARBOR_ROBOT_USER\",\"password\":\"$HARBOR_ROBOT_TOKEN\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context "${CI_PROJECT_DIR}" --dockerfile "${CI_PROJECT_DIR}/Dockerfile" --destination "$IMAGE_TAG" --destination "$IMAGE_LATEST"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy:
  stage: deploy
  image: alpine:3.19
  needs: ["build"]
  script:
    - apk add --no-cache git
    - sed -i "s#harbor.hitman.barysgame.kz/portfolio/hitman:.*#harbor.hitman.barysgame.kz/portfolio/hitman:$CI_COMMIT_SHORT_SHA#" k8s/deployment.yaml
    - git config user.email "gitlab-ci@hitman.barysgame.kz"
    - git config user.name "GitLab CI"
    - git remote set-url origin "https://root:${GITLAB_PUSH_TOKEN}@gitlab.hitman.barysgame.kz/${CI_PROJECT_PATH}.git"
    - git add k8s/deployment.yaml
    - >
      git diff --cached --quiet && echo "No image change, skipping commit" ||
      (git commit -m "Deploy image $CI_COMMIT_SHORT_SHA [skip ci]" && git push origin HEAD:$CI_COMMIT_BRANCH)
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
