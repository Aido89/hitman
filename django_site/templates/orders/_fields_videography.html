<div class="service-fields" data-service="videography" style="display:none">
  <label style="font-weight:600;display:block;margin-bottom:0.5rem">Тип съёмки</label>
  <label style="display:block"><input type="radio" name="videographyType" value="1cam" checked> 1 камерная (100,000₸)</label>
  <label style="display:block;margin-bottom:0.75rem"><input type="radio" name="videographyType" value="4cam"> 4 камерная (400,000₸)</label>
  <label style="font-weight:600;display:block;margin-bottom:0.5rem">Фотограф</label>
  <select name="photographer">
    <option value="none">Без фотографа</option>
    <option value="simple">Простая съемка (+50,000₸)</option>
    <option value="medium">Средняя сложность (+75,000₸)</option>
    <option value="complex">Высокая сложность (+100,000₸)</option>
  </select>
</div>
