# Конвейер автопубликации роликов Hitman: n8n (оркестрация) + Postiz (публикация в соцсети).
# Запуск: cp .env.example .env && отредактировать .env && docker compose up -d
# Требования к серверу: Docker + Compose v2, от 4 ГБ RAM (Temporal + Elasticsearch), домены с A-записями на сервер.

x-restart: &restart
  restart: unless-stopped

services:
  # ---------------------------------------------------------------- reverse proxy + TLS
  caddy:
    <<: *restart
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      POSTIZ_DOMAIN: ${POSTIZ_DOMAIN}
      N8N_DOMAIN: ${N8N_DOMAIN}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:-media.localhost}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./media:/srv/media:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on: [postiz, n8n, media]

  # ---------------------------------------------------------------- раздача готовых роликов
  # content-factory/publish.py кладёт MP4 в ./media, Postiz забирает их по http://media/<файл>
  media:
    <<: *restart
    image: nginx:1.27-alpine
    volumes:
      - ./media:/usr/share/nginx/html:ro
    networks: [edge]

  # ---------------------------------------------------------------- n8n
  n8n:
    <<: *restart
    image: docker.n8n.io/n8nio/n8n:latest
    environment:
      N8N_HOST: ${N8N_DOMAIN}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      WEBHOOK_URL: https://${N8N_DOMAIN}/
      GENERIC_TIMEZONE: Asia/Almaty
      TZ: Asia/Almaty
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      # workflow читает POSTIZ_* через $env
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      POSTIZ_API_URL: http://postiz:5000/api/public/v1
      POSTIZ_API_KEY: ${POSTIZ_API_KEY}
      PIPELINE_WEBHOOK_TOKEN: ${PIPELINE_WEBHOOK_TOKEN}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n:/workflows:ro
    networks: [edge, n8n-internal]
    depends_on:
      n8n-postgres:
        condition: service_healthy

  n8n-postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - n8n-postgres-data:/var/lib/postgresql/data
    networks: [n8n-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------- Postiz
  # Основано на официальном github.com/gitroomhq/postiz-docker-compose
  postiz:
    <<: *restart
    image: ghcr.io/gitroomhq/postiz-app:latest
    environment:
      MAIN_URL: https://${POSTIZ_DOMAIN}
      FRONTEND_URL: https://${POSTIZ_DOMAIN}
      NEXT_PUBLIC_BACKEND_URL: https://${POSTIZ_DOMAIN}/api
      BACKEND_INTERNAL_URL: http://localhost:3000
      JWT_SECRET: ${POSTIZ_JWT_SECRET}
      DATABASE_URL: postgresql://postiz:${POSTIZ_DB_PASSWORD}@postiz-postgres:5432/postiz
      REDIS_URL: redis://postiz-redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      IS_GENERAL: "true"
      # после создания своего аккаунта поставьте "true" в .env
      DISABLE_REGISTRATION: ${POSTIZ_DISABLE_REGISTRATION:-false}
      RUN_CRON: "true"
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      API_LIMIT: ${POSTIZ_API_LIMIT:-90}
      # --- площадки (ключи разработчика, см. README.md)
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      TIKTOK_CLIENT_ID: ${TIKTOK_CLIENT_ID:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_BOT_NAME: ${TELEGRAM_BOT_NAME:-}
      THREADS_APP_ID: ${THREADS_APP_ID:-}
      THREADS_APP_SECRET: ${THREADS_APP_SECRET:-}
      VK_ID: ${VK_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    networks: [edge, postiz-internal, temporal]
    healthcheck:
      test: ["CMD", "node", "-e", "const r=require('http').get('http://localhost:5000/',res=>process.exit(res.statusCode<500?0:1));r.on('error',()=>process.exit(1));r.setTimeout(4000,()=>{r.destroy();process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_healthy

  postiz-postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postiz
      POSTGRES_PASSWORD: ${POSTIZ_DB_PASSWORD}
      POSTGRES_DB: postiz
    volumes:
      - postiz-postgres-data:/var/lib/postgresql/data
    networks: [postiz-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz -d postiz"]
      interval: 10s
      timeout: 5s
      retries: 5

  postiz-redis:
    <<: *restart
    image: redis:7.2
    volumes:
      - postiz-redis-data:/data
    networks: [postiz-internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------- Temporal (нужен Postiz >= 2.12)
  temporal-elasticsearch:
    <<: *restart
    image: elasticsearch:7.17.27
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
    volumes:
      - temporal-elasticsearch-data:/usr/share/elasticsearch/data
    networks: [temporal]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  temporal-postgresql:
    <<: *restart
    image: postgres:16
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD}
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    networks: [temporal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    <<: *restart
    image: temporalio/auto-setup:1.28.1
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD}
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    networks: [temporal]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      temporal-postgresql:
        condition: service_healthy
      temporal-elasticsearch:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
  n8n-data:
  n8n-postgres-data:
  postiz-config:
  postiz-uploads:
  postiz-postgres-data:
  postiz-redis-data:
  temporal-elasticsearch-data:
  temporal-postgres-data:

networks:
  edge:
  n8n-internal:
  postiz-internal:
  temporal:
